{% extends "main/base.html" %}

{% block title %}
Log in
{% endblock %}
{% block body_class %}workspace-page{% endblock %}

{% block content %}

<div class="mx-auto" style="max-width: 28rem;">
    <div class="oil-page-header">
        <div class="oil-page-header-main"><h2>Log in</h2></div>
    </div>

    {% if form.errors %}
        <div class="alert alert-danger" role="alert">
            The username or password is incorrect.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button class="btn btn-primary" type="submit">Log in</button>
    </form>
</div>

{% endblock %}
