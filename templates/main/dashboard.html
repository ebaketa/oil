{% extends "main/base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<h2>Dashboard</h2>

<p class="text-muted">Overview of Open Instrument Lab.</p>

<div class="row g-3 mb-4">
    <div class="col-sm-6 col-xl-3">
        <a class="text-decoration-none text-body" href="{% url 'instrument_list' %}">
            <div class="card oil-dashboard-card">
                <div class="card-body">
                    <div class="oil-dashboard-card-title">Instruments</div>
                    <div class="display-6">{{ instrument_count }}</div>
                </div>
            </div>
        </a>
    </div>
    <div class="col-sm-6 col-xl-3">
        <div class="card oil-dashboard-card">
            <div class="card-body">
                <div class="oil-dashboard-card-title">Online</div>
                <div class="display-6 text-success">{{ online_instrument_count }}</div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
